<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Home View Presentation — Immersive Safari Test</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
    *,*::before,*::after{box-sizing:border-box;}
    iframe{display:block;position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;overflow:hidden;background:#000;}
  </style>
</head>
<body>
  <!-- Test the same iframe embedding approach as Lux on Elementor.
       The existing presentation and all its video/content remain unchanged.
       No scaling, zoom, transform or video cropping is applied by this wrapper. -->
  <iframe
    src="./"
    title="Home View Presentation"
    allow="autoplay; fullscreen"
    allowfullscreen
    scrolling="no"
  ></iframe>
</body>
</html>
